[project]
name = "necker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "tomli-w>=1.2.0,<2",
    "openai>=3.46.0,<4",
    "anthropic>=2.6.0,<3",
    "pydantic>=2.12.3,<3",
    "pyyaml>=6.0.3,<7",
    "python-dateutil>=4.0.0,<5",
    "flask>=3.1.3,<4",
    "flask-wtf>=1.2.2,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "pytest-cov>=7.0.0,<8",
    "python-lsp-server>=1.13.1,<2",
    "ruff>=0.14.2,<0.15",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "samples/*",
    ".venv/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
